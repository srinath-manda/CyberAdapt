[package]
name = "cyberadapt_native"
version = "0.1.0"
edition = "2021"
[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "precomputed-tables", "digest"] }
sha2 = "=0.10.8"
hmac = "=0.12.1"
rand = "=0.8.5"
fiat-crypto = "=0.2.9"
zeroize = "=1.7.0"
subtle = "=2.5.0"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
